name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

  verify-publish:
    name: Verify publish readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pack dry-run (sanity-check published files)
        run: npm pack --dry-run

      - name: Check version isn't already published
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo "[]")
          if echo "$PUBLISHED" | grep -q "\"$PKG_VERSION\""; then
            echo "::error::Version $PKG_VERSION of $PKG_NAME is already published to npm. Bump the version before merging."
            exit 1
          fi
          echo "Version $PKG_VERSION is not yet published — OK."
